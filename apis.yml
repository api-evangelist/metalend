aid: metalend
name: MetaLend
description: >-
  MetaLend is a DeFi "earn and spend" platform that aggregates lending pools across
  protocols (Aave, Morpho, Euler) and chains (Base, Ethereum, Polygon, Arbitrum, Linea)
  behind a single cross-chain Rebalancing API. It continuously repositions user-approved,
  self-custodied capital into the best-yielding pools while keeping funds instantly
  spendable via a debit card. The API is notably agent-native: it serves an AI agent flow
  guide at GET /SKILL.md, ships SIWE challenge/verify JWT auth with EIP-191/EIP-712/EIP-3009
  wallet signing, and gates its services directory behind an x402 (HTTP 402) micropayment in
  USDC on Base. Smart contracts are audited by Sherlock. Backed by Pantera Capital.
